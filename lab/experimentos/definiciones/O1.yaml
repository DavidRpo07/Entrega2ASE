# El runner toma el estado de la métrica trazas_activas (igual en todos los procesos).
id: O1
familia: observabilidad
falla: null
descripcion: Overhead de observabilidad, trazas OpenTelemetry encendidas vs. TRAZAS=off, misma carga sin falla
