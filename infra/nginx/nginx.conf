worker_processes auto;
events { worker_connections 4096; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # DNS de Docker: si api-2 está detenida (D1) nginx sigue arrancando y la
    # vuelve a resolver cuando regresa.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api {
        zone api 64k;
        server api-1:8000 resolve max_fails=1 fail_timeout=5s;
        server api-2:8000 resolve max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        location = /nginx-health { return 200 "ok\n"; }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            # POST no se reintenta en otra réplica (no es idempotente); GET sí ante error de conexión.
            proxy_next_upstream error timeout;
        }
    }
}
