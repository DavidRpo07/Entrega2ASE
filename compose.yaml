services:
  postgres:
    image: postgres:15
    container_name: postgres-escalables
    environment:
      POSTGRES_DB: escalables
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # con nombre: sobrevive a `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escalables"]
      interval: 2s
      timeout: 5s
      retries: 30

  # ---------------- Entregable 3: laboratorio de fallas ----------------
  # Se levanta con `make lab-up` (requiere `make datos` antes).
  api-1: &api
    build: { context: ., dockerfile: app/Dockerfile }
    image: escalables-lab:latest
    depends_on:
      postgres: { condition: service_healthy }
    environment: &api-env
      INSTANCIA: api-1
      DB_HOST: postgres
      POOL_MAX: "5"
      POOL_TIMEOUT_S: "5"
      FAULTS_FILE: /lab-runtime/faults.yaml
      FAULTS_RECARGA_S: "0.25"
      CATALOGO_FALLAS: /app/lab/fallas/catalogo.yaml
      CORRECCIONES_FILE: /lab-runtime/correcciones.yaml   # fase 4: correcciones en caliente
      CORRECCIONES_RECARGA_S: "0.25"
      CORRECCIONES_BASE: /app/lab/correcciones.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRAZAS: ${TRAZAS:-on}          # TRAZAS=off make lab-up → experimento de overhead
    volumes:
      - ./lab/runtime:/lab-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCIA: api-2

  worker:
    image: escalables-lab:latest
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres: { condition: service_healthy }
      api-1: { condition: service_started }   # misma imagen: espera a que se construya
    environment:
      <<: *api-env
      INSTANCIA: worker
      POOL_MAX: "2"
      EXT_SAP_URL: http://ext-sap:8000
      SAP_TIMEOUT_S: "30"
      METRICS_PORT: "9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./lab/runtime:/lab-runtime

  ext-sap:
    image: escalables-lab:latest
    command: ["python", "-m", "app.servir", "app.ext_sap:app"]
    depends_on:
      api-1: { condition: service_started }
    environment:
      INSTANCIA: ext-sap
      SAP_LATENCIA_MS: "20"
      FAULTS_FILE: /lab-runtime/faults.yaml
      FAULTS_RECARGA_S: "0.25"
      CATALOGO_FALLAS: /app/lab/fallas/catalogo.yaml
      CORRECCIONES_FILE: /lab-runtime/correcciones.yaml   # fase 4: correcciones en caliente
      CORRECCIONES_RECARGA_S: "0.25"
      CORRECCIONES_BASE: /app/lab/correcciones.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRAZAS: ${TRAZAS:-on}
    volumes:
      - ./lab/runtime:/lab-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Ejecuta las fallas 'externa' (B2: lock en BD, D1: docker stop/start) leyendo el
  # mismo faults.yaml; el kill switch las revierte. Necesita el socket de Docker
  # (acceso total a Docker del host: solo para este laboratorio local).
  fallas-ext:
    image: escalables-lab:latest
    command: ["python", "-m", "app.fallas_externas"]
    depends_on:
      postgres: { condition: service_healthy }
      api-1: { condition: service_started }
    environment:
      INSTANCIA: fallas-ext
      DB_HOST: postgres
      FAULTS_FILE: /lab-runtime/faults.yaml
      FAULTS_RECARGA_S: "0.25"
      CATALOGO_FALLAS: /app/lab/fallas/catalogo.yaml
      CORRECCIONES_FILE: /lab-runtime/correcciones.yaml   # fase 4: correcciones en caliente
      CORRECCIONES_RECARGA_S: "0.25"
      CORRECCIONES_BASE: /app/lab/correcciones.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRAZAS: ${TRAZAS:-on}
      METRICS_PORT: "9100"
    volumes:
      - ./lab/runtime:/lab-runtime
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.28.0
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------- Entregable 3, fase 2: observabilidad ----------------
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-datos:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/laboratorio.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Almacenamiento en memoria acotado: sin límite, Jaeger acumuló ~6,8 GB en 6,5 h y la VM de
      # Docker lo mató por OOM en plena falla de A2-corr (2026-10-17). Una corrida son ~15.000 trazas
      # (~40 KB c/u): 20.000 cubren la corrida en curso; las más viejas se descartan.
      MEMORY_MAX_TRACES: "20000"
    mem_limit: 1536m
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # CPU y memoria por contenedor (incluido postgres).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # Docker Desktop usa el snapshotter de containerd, que el factory de Docker de cAdvisor no
    # soporta ("failed to identify the read-write layer ID"). Sin socket de Docker, cAdvisor mide
    # los cgroups /docker/<id> en crudo; fallas-ext publica contenedor_info{id,servicio} para el join.
    command: ["--docker_only=false", "--housekeeping_interval=5s",
              "--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/escalables?sslmode=disable
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  prometheus-datos:

networks:
  default:
    name: escalables-lab
