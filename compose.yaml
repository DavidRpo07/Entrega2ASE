services:
  postgres:
    image: postgres:15
    container_name: postgres-escalables
    environment:
      POSTGRES_DB: escalables
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escalables"]
      interval: 2s
      timeout: 5s
      retries: 30
